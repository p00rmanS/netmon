<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NetMon</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%236b7280'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e2e5ea;
    --text: #1b1f24;
    --muted: #5f6b7a;
    --up: #1a7f4b;
    --up-bg: #e3f4ea;
    --down: #c62828;
    --down-bg: #fde8e8;
    --unknown: #6b7280;
    --unknown-bg: #eceef1;
    --warn: #9a6700;
    --accent: #2f6fdb;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --surface: #181c22;
      --border: #2a3039;
      --text: #e6e9ee;
      --muted: #97a1ae;
      --up: #4cc38a;
      --up-bg: #15322a;
      --down: #ff6b6b;
      --down-bg: #3a1a1c;
      --unknown: #9aa3af;
      --unknown-bg: #242a32;
      --warn: #e3b341;
      --accent: #6ea0ff;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 4px 0; letter-spacing: .2px; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .updated { color: var(--muted); font-size: 13px; }

  .banner {
    display: none; margin: 12px 0 0; padding: 10px 14px; border-radius: 10px;
    background: var(--down-bg); color: var(--down); font-weight: 600;
  }
  .banner.show { display: block; }

  .summary {
    margin: 14px 0 16px; padding: 14px 16px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600;
  }
  .summary .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--unknown); flex: none; }
  .summary.ok .dot { background: var(--up); }
  .summary.bad { border-color: var(--down); }
  .summary.bad .dot { background: var(--down); }
  .summary .sub { font-weight: 400; color: var(--muted); font-size: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; align-items: start; }
  .card {
    text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
    border-left: 5px solid var(--unknown);
  }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.UP { border-left-color: var(--up); }
  .card.DOWN { border-left-color: var(--down); background: var(--down-bg); }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .icon { font-size: 22px; line-height: 1; flex: none; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .ip { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .pill {
    margin-left: auto; flex: none; font-size: 12px; font-weight: 700; letter-spacing: .4px;
    padding: 3px 8px; border-radius: 999px; background: var(--unknown-bg); color: var(--unknown);
  }
  .pill.UP { background: var(--up-bg); color: var(--up); }
  .pill.DOWN { background: var(--down); color: #fff; }
  .card.warn { border-left-color: var(--warn); }
  .age { margin-left: auto; }
  .card-bottom { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: var(--muted); }
  .latency { font-size: 18px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .note { font-size: 13px; color: var(--warn); font-weight: 600; }
  .card.DOWN .note { color: var(--down); }
  .tip { font-size: 14px; line-height: 1.4; padding: 8px 10px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border); }
  .tip b { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .grid.stale .card { opacity: .55; }

  /* Loading placeholders */
  .card.skeleton { cursor: default; height: 108px; border-left-color: var(--border); }
  .card.skeleton::after { content: ""; display: block; height: 14px; width: 60%; border-radius: 6px; background: var(--unknown-bg); }

  /* A short highlight when a card changes status, so the change is noticed */
  @media (prefers-reduced-motion: no-preference) {
    .card.changed { animation: flash 1.6s ease-out; }
    @keyframes flash { 0% { box-shadow: 0 0 0 4px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
    .card.skeleton::after { animation: pulse 1.2s ease-in-out infinite alternate; }
    @keyframes pulse { to { opacity: .4; } }
  }

  /* Phones: healthy devices shrink to one line so problems stand out and lists stay short */
  @media (max-width: 599px) {
    .card.compact { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center;
      gap: 10px; padding: 10px 12px; }
    .card.compact .card-top, .card.compact .card-bottom { display: contents; }
    .card.compact .icon { font-size: 18px; }
    .card.compact .pill { order: 4; margin-left: 0; }
    .card.compact .latency { order: 3; font-size: 15px; }
    .card.compact .age { display: none; }
    .card.compact .ip { font-size: 12px; }
  }

  .incidents .inc { all: unset; box-sizing: border-box; width: 100%; padding: 10px 14px;
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; }
  .incidents button.inc { cursor: pointer; }
  .incidents button.inc:hover { background: var(--bg); }
  .incidents button.inc:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .incidents li.more { padding: 0; }
  .incidents li.more button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; padding: 10px 14px;
    color: var(--accent); font-weight: 600; font-size: 14px; text-align: center; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .updated.stale { color: var(--warn); font-weight: 600; }
  .dlg-head .pill { margin-left: 0; }
  .dlg-status { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
  .dlg-status.DOWN { color: var(--down); font-weight: 600; }
  #dlg-tip { margin-bottom: 12px; }

  .incidents { list-style: none; margin: 0; padding: 0; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .incidents li { border-top: 1px solid var(--border); }
  .incidents li.empty { padding: 14px; }
  .incidents li:first-child { border-top: 0; }
  .incidents .when { color: var(--muted); font-size: 13px; }
  .incidents .ongoing { color: var(--down); font-weight: 600; }
  .empty { color: var(--muted); }

  dialog {
    width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
    border: 1px solid var(--border); border-radius: 14px; padding: 0;
    background: var(--surface); color: var(--text);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  .dlg-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .dlg-head h3 { margin: 0; font-size: 16px; flex: 1; overflow-wrap: anywhere; }
  .close { font: inherit; font-size: 20px; line-height: 1; background: none; border: 0; color: var(--muted);
    cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .close:hover { background: var(--unknown-bg); }
  .dlg-body { padding: 12px 16px 16px; }
  .chart-wrap { position: relative; height: 280px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .legend .fail { color: var(--down); font-weight: 600; }
  .chart-msg { color: var(--muted); padding: 40px 0; text-align: center; }

  /* ---------- manage devices ---------- */
  .head-right { display: flex; align-items: center; gap: 8px; }
  .head-right .btn { white-space: nowrap; }
  .title-block { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  @media (max-width: 599px) {
    .title-block { flex-direction: column; gap: 0; }
    .title-block .updated { font-size: 12px; }
  }
  .summary.stale { opacity: .55; }
  .btn {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
  }
  a.btn { text-decoration: none; display: inline-block; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--down); }
  .btn.small { font-size: 13px; padding: 5px 10px; }
  .list-top { margin-bottom: 12px; }
  .dev-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; }
  .dev-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--border); }
  .dev-list li:first-child { border-top: 0; }
  .dev-list .grow { flex: 1; min-width: 0; }
  .dev-list .actions { display: flex; gap: 6px; flex: none; }
  .form { display: grid; gap: 12px; }
  .form label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .form input, .form select {
    font: inherit; font-size: 16px; /* 16px stops phones zooming in */
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); width: 100%;
  }
  .form input:focus, .form select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form .hint { font-weight: 400; font-size: 12px; }
  .form-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .form-actions .spacer { flex: 1; }
  .msg { font-size: 14px; min-height: 1.45em; }
  .msg.ok { color: var(--up); }
  .msg.err { color: var(--down); }
  .msg.info { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <div class="title-block">
      <h1>NetMon</h1>
      <span class="updated" id="updated">Loading…</span>
    </div>
    <div class="head-right">
      <a class="btn small" id="report-link" href="report">Weekly report</a>
      <button class="btn small" id="manage-btn" hidden>Manage devices</button>
    </div>
  </header>
  <div class="banner" id="banner">Can't reach NetMon. Showing the last known status.</div>

  <div class="summary" id="summary"><span class="dot"></span><span id="summary-text">Loading devices…</span></div>

  <div class="sr-only" id="announce" aria-live="assertive"></div>
  <div class="grid" id="grid">
    <div class="card skeleton" aria-hidden="true"></div><div class="card skeleton" aria-hidden="true"></div><div class="card skeleton" aria-hidden="true"></div>
  </div>

  <h2>Recent incidents</h2>
  <ul class="incidents" id="incidents"><li class="empty">Loading…</li></ul>
</main>

<dialog id="detail">
  <div class="dlg-head">
    <span class="icon" id="dlg-icon"></span>
    <h3 id="dlg-title"></h3>
    <span class="pill" id="dlg-pill"></span>
    <button class="close" id="dlg-close" aria-label="Close">✕</button>
  </div>
  <div class="dlg-body">
    <div class="dlg-status" id="dlg-status"></div>
    <div class="tip" id="dlg-tip" hidden><b>What to do</b><span></span></div>
    <div class="chart-wrap"><canvas id="chart"></canvas><div class="chart-msg" id="chart-msg" hidden></div></div>
    <div class="legend" id="legend"></div>
  </div>
</dialog>

<dialog id="manage">
  <div class="dlg-head">
    <span class="icon" aria-hidden="true">⚙️</span>
    <h3 id="manage-title">Manage devices</h3>
    <button class="close" id="manage-close" aria-label="Close">✕</button>
  </div>
  <div class="dlg-body">
    <!-- list view -->
    <div id="manage-list-view">
      <div class="form-actions list-top">
        <button class="btn primary" id="add-btn">+ Add device</button>
        <span class="msg" id="list-msg" role="status"></span>
      </div>
      <ul class="dev-list" id="dev-list"></ul>
    </div>

    <!-- add / edit form -->
    <form class="form" id="dev-form" hidden novalidate>
      <label>Name
        <input id="f-name" maxlength="60" required placeholder="e.g. Kitchen Printer" autocomplete="off">
      </label>
      <label>Type
        <select id="f-type">
          <option value="printer">🧾 Receipt printer</option>
          <option value="pos">💳 POS / tablet</option>
          <option value="router">📡 Router</option>
          <option value="switch">🔀 Switch</option>
          <option value="ap">📶 Wi-Fi access point</option>
          <option value="internet">🌐 Internet</option>
        </select>
      </label>
      <label>IP address
        <input id="f-ip" required placeholder="e.g. 192.168.50.60" inputmode="decimal" autocomplete="off">
      </label>
      <div class="row2">
        <label>Check with
          <select id="f-check">
            <option value="ping">Ping</option>
            <option value="tcp">TCP port</option>
          </select>
        </label>
        <label id="f-port-wrap">Port
          <input id="f-port" type="number" min="1" max="65535" inputmode="numeric" placeholder="9100">
        </label>
      </div>
      <div class="msg" id="form-msg"></div>
      <div class="form-actions">
        <button type="button" class="btn" id="test-btn">Test</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn primary" id="save-btn">Save</button>
      </div>
    </form>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
        integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
"use strict";

const REFRESH_MS = 10000;
const ICONS = { router: "📡", switch: "🔀", ap: "📶", printer: "🧾", pos: "💳", internet: "🌐" };
const STATUS_ORDER = { DOWN: 0, UNKNOWN: 1, UP: 2 };

let devices = [];
let fetchedAt = 0;          // performance.now() when `devices` arrived
let lastOkAt = null;        // Date.now() of the last successful refresh
let openDeviceId = null;
let chart = null;

const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtDuration(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return `${sec}s`;
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m < 60) return s ? `${m}m ${s}s` : `${m}m`;
  const h = Math.floor(m / 60), mm = m % 60;
  if (h < 24) return mm ? `${h}h ${mm}m` : `${h}h`;
  const d = Math.floor(h / 24), hh = h % 24;
  return hh ? `${d}d ${hh}h` : `${d}d`;
}

function fmtTime(iso) {
  const d = new Date(iso);
  const sameDay = d.toDateString() === new Date().toDateString();
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return sameDay ? time : `${d.toLocaleDateString([], { month: "short", day: "numeric" })} ${time}`;
}

function fmtLatency(ms) {
  if (ms == null) return "—";
  return ms < 10 ? `${ms.toFixed(1)} ms` : `${Math.round(ms)} ms`;
}

// Seconds since the device was checked, counted from the server's value so a
// wrong phone clock doesn't matter.
function ageNow(d) {
  if (d.seconds_since_check == null) return null;
  return d.seconds_since_check + (performance.now() - fetchedAt) / 1000;
}

// Give up after a few seconds so a hung connection shows the "can't reach" banner
// instead of leaving the page silently frozen.
async function getJSON(url, timeoutMs = 8000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { cache: "no-store", signal: ctl.signal });
    if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

// ------------------------------------------------------------ rendering

const FAVICON_COLORS = { bad: "#c62828", ok: "#1a7f4b", none: "#6b7280" };

function renderSummary() {
  const box = $("summary");
  const up = devices.filter((d) => d.status === "UP").length;
  const down = devices.filter((d) => d.status === "DOWN").length;
  const unknown = devices.length - up - down;
  box.classList.toggle("bad", down > 0);
  box.classList.toggle("ok", down === 0 && unknown === 0 && devices.length > 0);
  let sub = "";
  if (down) sub = `${down} down`;
  if (unknown) sub += `${sub ? " · " : ""}${unknown} unknown`;
  $("summary-text").innerHTML = devices.length
    ? `${up} of ${devices.length} devices up` + (sub ? ` <span class="sub">(${esc(sub)})</span>` : "")
    : "No devices yet";

  // The browser tab shows the status too, for when the page is in the background.
  document.title = down ? `(${down} down) NetMon` : "NetMon";
  const color = FAVICON_COLORS[down ? "bad" : up && !unknown ? "ok" : "none"];
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='${color}'/></svg>`;
  $("favicon").href = "data:image/svg+xml," + encodeURIComponent(svg);
}

function cardNote(d) {
  if (d.status === "DOWN" && d.seconds_failing != null) {
    const since = d.seconds_failing + (performance.now() - fetchedAt) / 1000;
    return `Down for ${fmtDuration(since)}`;
  }
  if (d.status !== "DOWN" && d.consecutive_failures > 0) {
    const n = d.consecutive_failures;
    return `${n} missed check${n > 1 ? "s" : ""}`;
  }
  return "";
}

// Cards are kept and updated in place rather than rebuilt on every refresh, so
// nothing flickers, hover and keyboard focus survive, and only real changes move.
const cards = new Map();    // device id -> card element
const lastStatus = new Map(); // device id -> status seen on the previous refresh

function setText(el, text) {
  if (el.textContent !== text) el.textContent = text;
}

function createCard(id) {
  const el = document.createElement("button");
  el.className = "card";
  el.dataset.id = id;
  el.innerHTML = `
    <div class="card-top">
      <span class="icon" aria-hidden="true"></span>
      <div class="who"><div class="name"></div><div class="ip"></div></div>
      <span class="pill"></span>
    </div>
    <div class="note" hidden></div>
    <div class="tip" hidden><b>What to do</b><span></span></div>
    <div class="card-bottom"><span class="latency"></span><span class="age"></span></div>`;
  const q = (sel) => el.querySelector(sel);
  el._parts = { icon: q(".icon"), name: q(".name"), ip: q(".ip"), pill: q(".pill"), note: q(".note"),
                tip: q(".tip"), tipText: q(".tip span"), latency: q(".latency"), age: q(".age") };
  return el;
}

function updateCard(el, d) {
  const p = el._parts;
  const note = cardNote(d);
  const warn = d.status !== "DOWN" && d.consecutive_failures > 0;
  // On phones, healthy devices collapse to one line; anything needing attention stays full size.
  const compact = d.status === "UP" && !warn;
  const cls = `card ${d.status}${warn ? " warn" : ""}${compact ? " compact" : ""}`;
  if (el.className.replace(" changed", "") !== cls) {
    el.className = cls + (el.classList.contains("changed") ? " changed" : "");
  }
  setText(p.icon, ICONS[d.type] || "❔");
  setText(p.name, d.name);
  setText(p.ip, d.check_method === "tcp" ? `${d.ip}:${d.port}` : d.ip);
  p.pill.className = `pill ${d.status}`;
  setText(p.pill, d.status);
  p.note.hidden = !note;
  setText(p.note, note);
  p.tip.hidden = !(d.status === "DOWN" && d.tip);
  setText(p.tipText, d.tip || "");
  // A down device has no latency to show; the tip takes that space.
  p.latency.hidden = d.status === "DOWN";
  setText(p.latency, fmtLatency(d.last_latency_ms));
  el.setAttribute("aria-label", `${d.name}, ${d.status}${note ? `, ${note}` : ""}. Show latency chart`);
}

function flash(el) {
  el.classList.remove("changed");
  void el.offsetWidth; // restart the animation
  el.classList.add("changed");
  setTimeout(() => el.classList.remove("changed"), 1700);
}

function renderGrid() {
  const grid = $("grid");
  grid.querySelectorAll(".skeleton").forEach((el) => el.remove());
  const sorted = [...devices].sort(
    (a, b) => STATUS_ORDER[a.status] - STATUS_ORDER[b.status] || a.name.localeCompare(b.name)
  );
  const seen = new Set();
  const changes = [];
  for (const d of sorted) {
    seen.add(d.id);
    let el = cards.get(d.id);
    if (!el) { el = createCard(d.id); cards.set(d.id, el); }
    updateCard(el, d);
    const before = lastStatus.get(d.id);
    if (before && before !== d.status) {
      flash(el);
      changes.push(`${d.name} is ${d.status === "UP" ? "back up" : d.status.toLowerCase()}`);
    }
    lastStatus.set(d.id, d.status);
  }
  for (const [id, el] of cards) {
    if (!seen.has(id)) { el.remove(); cards.delete(id); lastStatus.delete(id); }
  }

  // Put cards in order, moving only the ones that are out of place.
  const focused = document.activeElement;
  let ref = grid.firstElementChild;
  for (const d of sorted) {
    const el = cards.get(d.id);
    if (el === ref) ref = ref.nextElementSibling;
    else grid.insertBefore(el, ref);
  }
  if (focused && focused !== document.activeElement && grid.contains(focused)) focused.focus();

  if (!sorted.length && !grid.querySelector(".empty")) {
    grid.innerHTML = `<p class="empty">No devices are being watched yet.` +
      (canEdit ? ` Click <b>Manage devices</b> to add your router, printers and tablets.` : "") + `</p>`;
  } else if (sorted.length) {
    grid.querySelector(".empty")?.remove();
  }
  if (changes.length) setText($("announce"), changes.join(". "));
  tickAges();
}

function tickAges() {
  for (const d of devices) {
    const el = cards.get(d.id);
    if (!el) continue;
    const age = ageNow(d);
    setText(el._parts.age, age == null ? "Not checked yet" : `Checked ${fmtDuration(age)} ago`);
    const note = cardNote(d); // "Down for ..." keeps counting between refreshes
    if (note) setText(el._parts.note, note);
  }
  const upd = $("updated");
  if (lastOkAt == null) {
    setText(upd, failures ? "Can't reach NetMon" : "Loading…");
  } else {
    const age = (Date.now() - lastOkAt) / 1000;
    setText(upd, `Updated ${fmtDuration(age)} ago`);
    upd.classList.toggle("stale", age > REFRESH_MS / 1000 * 2.5);
  }
}

const INCIDENTS_SHOWN = 8;
let incidents = [];
let showAllIncidents = false;

function renderIncidents() {
  const ul = $("incidents");
  if (!incidents.length) {
    ul.innerHTML = `<li class="empty">No incidents yet. 🎉</li>`;
    return;
  }
  const list = showAllIncidents ? incidents : incidents.slice(0, INCIDENTS_SHOWN);
  const active = new Set(devices.map((d) => d.id));
  ul.innerHTML = list.map((i) => {
    const body = `
      <span>${ICONS[i.device_type] || "❔"} <strong>${esc(i.device_name)}</strong></span>
      <span class="when">
        ${fmtTime(i.started_at)} ·
        ${i.ongoing
          ? `<span class="ongoing">Ongoing, ${fmtDuration(i.duration_s)}</span>`
          : `down ${fmtDuration(i.duration_s)}`}
      </span>`;
    // Removed devices have no live chart to open.
    return active.has(i.device_id)
      ? `<li><button class="inc" data-device="${i.device_id}" aria-label="${esc(i.device_name)}: show chart">${body}</button></li>`
      : `<li><div class="inc">${body}</div></li>`;
  }).join("") + (incidents.length > INCIDENTS_SHOWN
    ? `<li class="more"><button id="more-incidents">${showAllIncidents ? "Show fewer" : `Show all ${incidents.length}`}</button></li>`
    : "");
}

$("incidents").addEventListener("click", (e) => {
  if (e.target.closest("#more-incidents")) {
    showAllIncidents = !showAllIncidents;
    renderIncidents();
    return;
  }
  const row = e.target.closest("button.inc");
  if (row) openDetail(Number(row.dataset.device));
});

// ------------------------------------------------------------ chart

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

async function loadChart(id) {
  const msg = $("chart-msg"), canvas = $("chart");
  if (typeof Chart === "undefined") {
    canvas.hidden = true; msg.hidden = false;
    msg.textContent = "Chart library couldn't load (no internet connection?). Status above is still live.";
    $("legend").textContent = "";
    return;
  }
  let data;
  try {
    data = await getJSON(`/api/devices/${id}/history?hours=24`);
  } catch {
    canvas.hidden = true; msg.hidden = false;
    msg.textContent = "Couldn't load history.";
    return;
  }
  if (openDeviceId !== id) return; // dialog was closed or switched meanwhile

  const pts = data.points.map((p) => ({ x: Date.parse(p.t), up: p.is_up, y: p.latency_ms }));
  if (!pts.length) {
    canvas.hidden = true; msg.hidden = false;
    msg.textContent = "No checks recorded yet.";
    $("legend").textContent = "";
    return;
  }
  canvas.hidden = false; msg.hidden = true;

  chartLoadedAt = performance.now();
  const ok = pts.filter((p) => p.up).map((p) => p.y);
  const failed = pts.filter((p) => !p.up);
  const avg = ok.length ? ok.reduce((a, b) => a + b, 0) / ok.length : null;
  const uptime = (ok.length / pts.length) * 100;
  // Round down, so 99.97% never shows as "100%" when checks actually failed.
  const uptimeText = uptime === 100 ? "100" : (Math.floor(uptime * 10) / 10).toFixed(1);
  $("legend").innerHTML =
    `<span>Uptime (24h): <strong>${uptimeText}%</strong></span>` +
    `<span>Avg latency: <strong>${fmtLatency(avg)}</strong></span>` +
    (failed.length
      ? `<span class="fail">✕ ${failed.length} failed check${failed.length === 1 ? "" : "s"}</span>`
      : `<span>No failed checks</span>`);

  // Failed checks drawn as red crosses on the x-axis; the latency line has a gap there.
  const line = pts.map((p) => ({ x: p.x, y: p.up ? p.y : null }));
  const fails = failed.map((p) => ({ x: p.x, y: 0 }));
  const up = cssVar("--up"), down = cssVar("--down"), grid = cssVar("--border"), muted = cssVar("--muted");

  const now = Date.now();
  const min = now - 24 * 3600e3;
  // Ticks on round hours; fewer of them on narrow (phone) screens.
  const stepH = canvas.parentElement.clientWidth < 500 ? 6 : 3;
  const roundTicks = (scale) => {
    const t = new Date(min);
    t.setMinutes(0, 0, 0);
    t.setHours(Math.ceil((t.getHours() + 1) / stepH) * stepH);
    const ticks = [];
    for (let v = t.getTime(); v <= now; v += stepH * 3600e3) ticks.push({ value: v });
    scale.ticks = ticks;
  };
  const config = {
    data: {
      datasets: [
        { type: "line", label: "Latency (ms)", data: line, borderColor: up, backgroundColor: up,
          borderWidth: 1.5, pointRadius: pts.length < 60 ? 2.5 : 0, pointHitRadius: 6,
          spanGaps: false, tension: 0.2 },
        { type: "scatter", label: "Failed check", data: fails, borderColor: down, backgroundColor: down,
          pointStyle: "crossRot", pointRadius: 6, pointBorderWidth: 2, clip: false },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "nearest", intersect: false },
      scales: {
        x: {
          type: "linear", min, max: now, afterBuildTicks: roundTicks,
          grid: { color: grid }, ticks: { color: muted, maxRotation: 0,
            callback: (v) => new Date(v).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) },
        },
        y: { beginAtZero: true, grid: { color: grid }, ticks: { color: muted },
             title: { display: true, text: "ms", color: muted } },
      },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          title: (items) => new Date(items[0].parsed.x).toLocaleString(),
          label: (item) => item.datasetIndex === 1 ? "Failed check" : `${fmtLatency(item.parsed.y)}`,
        } },
      },
    },
  };
  // Same device already drawn: swap the data in place, so the chart doesn't
  // flicker and a tooltip being read isn't wiped out.
  if (chart && chart.$deviceId === id) {
    chart.data.datasets[0].data = line;
    chart.data.datasets[0].pointRadius = config.data.datasets[0].pointRadius;
    chart.data.datasets[1].data = fails;
    chart.options.scales.x.min = min;
    chart.options.scales.x.max = now;
    chart.options.scales.x.afterBuildTicks = roundTicks;
    chart.update("none");
    return;
  }
  if (chart) chart.destroy();
  chart = new Chart(canvas, config);
  chart.$deviceId = id;
}

function renderDetailHead() {
  const d = devices.find((x) => x.id === openDeviceId);
  if (!d) return;
  $("dlg-icon").textContent = ICONS[d.type] || "❔";
  setText($("dlg-title"), `${d.name}: last 24 hours`);
  $("dlg-pill").className = `pill ${d.status}`;
  setText($("dlg-pill"), d.status);
  const addr = d.check_method === "tcp" ? `${d.ip}, port ${d.port}` : d.ip;
  let status;
  if (d.status === "DOWN" && d.failing_since) {
    const since = new Date(d.failing_since).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    status = `Not responding since ${since} · ${addr}`;
  } else if (d.status === "UP") {
    status = `Responding in ${fmtLatency(d.last_latency_ms)} · ${addr}`;
  } else {
    status = `Waiting for the first successful check · ${addr}`;
  }
  $("dlg-status").className = `dlg-status ${d.status}`;
  setText($("dlg-status"), status);
  $("dlg-tip").hidden = !(d.status === "DOWN" && d.tip);
  setText($("dlg-tip").querySelector("span"), d.tip || "");
}

function openDetail(id) {
  const d = devices.find((x) => x.id === id);
  if (!d) return;
  openDeviceId = id;
  renderDetailHead();
  const dlg = $("detail");
  if (!dlg.open) dlg.showModal();
  loadChart(id);
}

function closeDetail() {
  openDeviceId = null;
  if (chart) { chart.destroy(); chart = null; }
  if ($("detail").open) $("detail").close();
}

$("grid").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (card) openDetail(Number(card.dataset.id));
});
$("dlg-close").addEventListener("click", closeDetail);
$("detail").addEventListener("close", () => { openDeviceId = null; if (chart) { chart.destroy(); chart = null; } });
$("detail").addEventListener("click", (e) => { if (e.target === $("detail")) closeDetail(); });

// ------------------------------------------------------------ manage devices

let editingId = null; // null while adding a new device

async function sendJSON(method, url, body) {
  const r = await fetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 204) return null;
  let data = null;
  try { data = await r.json(); } catch { /* no body */ }
  if (!r.ok) {
    let msg = data && data.detail;
    if (Array.isArray(msg)) msg = msg.map((e) => e.msg).join("; ");
    throw new Error(msg || `Request failed (HTTP ${r.status})`);
  }
  return data;
}

function setMsg(id, text, kind) {
  const el = $(id);
  el.textContent = text || "";
  el.className = `msg ${kind || ""}`;
}

function renderDevList() {
  const list = [...devices].sort((a, b) => a.name.localeCompare(b.name));
  $("dev-list").innerHTML = list.length
    ? list.map((d) => `
        <li>
          <span class="icon" aria-hidden="true">${ICONS[d.type] || "❔"}</span>
          <div class="grow">
            <div class="name">${esc(d.name)}</div>
            <div class="ip">${esc(d.check_method === "tcp" ? `${d.ip} · TCP ${d.port}` : `${d.ip} · ping`)}</div>
          </div>
          <div class="actions">
            <button class="btn small" data-edit="${d.id}">Edit</button>
            <button class="btn small danger" data-remove="${d.id}">Remove</button>
          </div>
        </li>`).join("")
    : `<li class="empty">No devices yet. Add your first one.</li>`;
}

function showList() {
  editingId = null;
  $("manage-title").textContent = "Manage devices";
  $("dev-form").hidden = true;
  $("manage-list-view").hidden = false;
  renderDevList();
}

function syncPortField() {
  $("f-port-wrap").style.visibility = $("f-check").value === "tcp" ? "visible" : "hidden";
}

function showForm(d) {
  editingId = d ? d.id : null;
  $("manage-title").textContent = d ? `Edit ${d.name}` : "Add device";
  $("f-name").value = d ? d.name : "";
  $("f-type").value = d ? d.type : "printer";
  $("f-ip").value = d ? d.ip : "";
  $("f-check").value = d ? d.check_method : "tcp";
  $("f-port").value = d ? (d.port ?? "") : "9100";
  syncPortField();
  setMsg("form-msg", "");
  $("manage-list-view").hidden = true;
  $("dev-form").hidden = false;
  $("f-name").focus();
}

function formValues() {
  const check = $("f-check").value;
  const port = $("f-port").value.trim();
  return {
    name: $("f-name").value,
    type: $("f-type").value,
    ip: $("f-ip").value.trim(),
    check,
    port: check === "tcp" && port !== "" ? Number(port) : null,
  };
}

// Sensible defaults: printers are checked on port 9100, everything else by ping.
$("f-type").addEventListener("change", () => {
  if (editingId !== null) return; // don't change an existing device's check behind the user's back
  const printer = $("f-type").value === "printer";
  $("f-check").value = printer ? "tcp" : "ping";
  if (printer && !$("f-port").value) $("f-port").value = "9100";
  syncPortField();
});
$("f-check").addEventListener("change", () => {
  if ($("f-check").value === "tcp" && !$("f-port").value && $("f-type").value === "printer") {
    $("f-port").value = "9100";
  }
  syncPortField();
});

$("test-btn").addEventListener("click", async () => {
  const { ip, check, port } = formValues();
  const btn = $("test-btn");
  btn.disabled = true;
  setMsg("form-msg", "Testing…", "info");
  try {
    const r = await sendJSON("POST", "/api/check", { ip, check, port });
    if (r.is_up) {
      setMsg("form-msg", `✓ It answered in ${fmtLatency(r.latency_ms)}.`, "ok");
    } else {
      setMsg("form-msg",
        `✕ No answer (${r.error || "failed"}). Check the IP address` +
        (check === "tcp" ? " and port" : "") + ", and that the device is switched on.", "err");
    }
  } catch (err) {
    setMsg("form-msg", err.message, "err");
  } finally {
    btn.disabled = false;
  }
});

$("dev-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("save-btn");
  btn.disabled = true;
  setMsg("form-msg", "Saving…", "info");
  try {
    const body = formValues();
    const saved = editingId === null
      ? await sendJSON("POST", "/api/devices", body)
      : await sendJSON("PUT", `/api/devices/${editingId}`, body);
    await refresh();
    showList();
    setMsg("list-msg", `Saved "${saved.name}". Checking it now…`, "ok");
    setTimeout(refresh, 3000); // pick up the first check result quickly
  } catch (err) {
    setMsg("form-msg", err.message, "err");
  } finally {
    btn.disabled = false;
  }
});

$("dev-list").addEventListener("click", async (e) => {
  const editId = e.target.dataset.edit, removeId = e.target.dataset.remove;
  if (editId) {
    showForm(devices.find((d) => d.id === Number(editId)));
  } else if (removeId) {
    const d = devices.find((x) => x.id === Number(removeId));
    if (!d || !confirm(`Remove "${d.name}"?\n\nIt will stop being monitored. Its history is kept, ` +
                       `and adding it back with the same name brings the history back.`)) return;
    try {
      await sendJSON("DELETE", `/api/devices/${d.id}`);
      await refresh();
      renderDevList();
      setMsg("list-msg", `Removed "${d.name}".`, "ok");
    } catch (err) {
      setMsg("list-msg", err.message, "err");
    }
  }
});

$("manage-btn").addEventListener("click", () => {
  setMsg("list-msg", "");
  showList();
  $("manage").showModal();
});
$("add-btn").addEventListener("click", () => showForm(null));
$("cancel-btn").addEventListener("click", showList);
$("manage-close").addEventListener("click", () => $("manage").close());

// Only the NetMon computer itself may change devices; phones just view.
let canEdit = false;
getJSON("/api/meta").then((m) => {
  canEdit = m.can_edit;
  $("manage-btn").hidden = !canEdit;
  if (!devices.length && lastOkAt != null) renderGrid();
}).catch(() => {});

// ------------------------------------------------------------ refresh loop

const CHART_REFRESH_MS = 30000; // history changes slowly; no need to refetch 24 h every 10 s
let chartLoadedAt = 0;
let failures = 0;      // consecutive failed refreshes
let inFlight = null;   // never run two refreshes at once

function refresh() {
  if (!inFlight) inFlight = doRefresh().finally(() => { inFlight = null; });
  return inFlight;
}

async function doRefresh() {
  try {
    const [devs, incs] = await Promise.all([getJSON("/api/devices"), getJSON("/api/incidents?limit=50")]);
    devices = devs;
    incidents = incs;
    fetchedAt = performance.now();
    lastOkAt = Date.now();
    failures = 0;
    $("banner").classList.remove("show");
    $("grid").classList.remove("stale");
    $("summary").classList.remove("stale");
    renderSummary();
    renderGrid();
    renderIncidents();
    if (openDeviceId != null) {
      renderDetailHead();
      if (performance.now() - chartLoadedAt > CHART_REFRESH_MS) loadChart(openDeviceId);
    }
    if ($("manage").open && !$("manage-list-view").hidden) renderDevList();
  } catch (err) {
    console.error(err);
    failures += 1;
    // One blip isn't worth alarming anyone; two in a row (or never loaded) is.
    if (failures >= 2 || lastOkAt == null) {
      const since = lastOkAt == null ? "" : ` since ${new Date(lastOkAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
      $("banner").textContent = `Can't reach NetMon${since}. Status below may be out of date.`;
      $("banner").classList.add("show");
      $("grid").classList.add("stale");
      $("summary").classList.add("stale");
      document.title = "(offline) NetMon";
    }
    tickAges();
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
setInterval(tickAges, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
